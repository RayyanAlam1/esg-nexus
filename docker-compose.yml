name: esg-nexus
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: esg_nexus
      POSTGRES_USER: esg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-esg_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esg -d esg_nexus"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-esgminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-esgminio_dev_password}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ESG_ENVIRONMENT: ${ESG_ENVIRONMENT:-development}
      ESG_DATABASE_URL: postgresql+psycopg://esg:${POSTGRES_PASSWORD:-esg_dev_password}@db:5432/esg_nexus
      ESG_REDIS_URL: redis://redis:6379/0
      ESG_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      ESG_OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-esgminio}
      ESG_OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-esgminio_dev_password}
      ESG_SECRET_KEY: ${ESG_SECRET_KEY:-change-me-in-production}
      ESG_AI_PROVIDER: ${ESG_AI_PROVIDER:-offline}
      ESG_ANTHROPIC_MODEL: ${ESG_ANTHROPIC_MODEL:-claude-opus-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ESG_CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'
      ESG_JSON_LOGS: "true"
      ESG_AUTO_SEED: ${ESG_AUTO_SEED:-true}
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      ESG_DATABASE_URL: postgresql+psycopg://esg:${POSTGRES_PASSWORD:-esg_dev_password}@db:5432/esg_nexus
      ESG_REDIS_URL: redis://redis:6379/0
      ESG_AI_PROVIDER: ${ESG_AI_PROVIDER:-offline}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ESG_AUTO_SEED: "false"
      ESG_JSON_LOGS: "true"
    volumes:
      - storage:/data/storage
    depends_on:
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE: /api/v1
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  redisdata:
  miniodata:
  storage:
