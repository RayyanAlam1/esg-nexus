# Report template — full ESG report structure. Sections are configuration: each lists the governed metrics
# and framework requirements it discloses, and whether narrative is AI-drafted (then reviewed) or data-only.
code: ESG_ANNUAL
name: Annual Sustainability Report (integrated ESG)
description: Cover-to-appendix structure with executive summary, materiality, environment, social, governance, prosperity, targets, framework index, methodology and assurance statement.
sections:
  - {code: cover, title: Cover Page, level: 0, source: template}
  - {code: exec_summary, title: Executive Summary, level: 1, source: ai, metrics: [ENV.GHG.SCOPE1_2_TOTAL, ENV.ENERGY.TOTAL, ENV.WATER.WITHDRAWN, ENV.WASTE.TOTAL, SOC.WORKFORCE.TOTAL, SOC.OHS.TRIR_EMP, SOC.OHS.TRIR_CONTRACTOR, GOV.ETHICS.CORRUPTION_CASES_SUBSTANTIATED, ECO.FIN.REVENUE, ECO.EVGD.WEALTH_GENERATED], requirements: [WEF.GOV.PURPOSE]}
  - {code: about, title: About the Organisation and this Report, level: 1, source: ai, metrics: [GOV.ORG.LEGAL_FORM, GOV.ORG.REPORTING_BOUNDARY, GOV.ORG.REPORTING_PERIOD, GOV.ASSURANCE.FRAMEWORKS_APPLIED, GOV.ASSURANCE.EXTERNAL_ASSURANCE], requirements: [GRI.2-1, GRI.2-2, GRI.2-3, GRI.2-5]}
  - {code: strategy, title: ESG Strategy and Governance of Sustainability, level: 1, source: ai, metrics: [GOV.PURPOSE.STATEMENT, GOV.BOARD.SUSTAINABILITY_OVERSIGHT, GOV.RISK.ERM_FRAMEWORK], requirements: [WEF.GOV.PURPOSE, WEF.GOV.RISK_OPPORTUNITY, IFRS.S1.GOV]}
  - {code: materiality, title: Materiality Assessment, level: 1, source: ai, metrics: [GOV.STAKEHOLDER.MATERIAL_TOPICS, GOV.STAKEHOLDER.MATERIALITY_PROCESS, GOV.STAKEHOLDER.ENGAGEMENT_APPROACH], requirements: [WEF.GOV.MATERIAL_ISSUES, GRI.3-3, ESRS.2.IRO-1], chart: materiality_matrix}
  - {code: environment, title: Environment, level: 1, source: template}
  - {code: climate, title: Climate Strategy and Risk, level: 2, source: ai, metrics: [ENV.CLIMATE.TCFD_ALIGNMENT, ENV.CLIMATE.PARIS_TARGET_SET, GOV.RISK.CLIMATE_RISK_ASSESSMENT_STATUS, ENV.CLIMATE.GHG_TARGET], requirements: [WEF.PLANET.TCFD, IFRS.S2.STRATEGY.RISKS, IFRS.S2.33]}
  - {code: ghg, title: GHG Emissions, level: 2, source: ai, metrics: [ENV.GHG.SCOPE1, ENV.GHG.SCOPE2, ENV.GHG.SCOPE1_2_TOTAL, ENV.GHG.SCOPE3, ENV.GHG.INTENSITY_REVENUE, ENV.GHG.YOY_CHANGE_PCT, ENV.GHG.GASES_COVERED, ENV.GHG.METHODOLOGY], requirements: [WEF.PLANET.GHG_EMISSIONS, GRI.305-1, GRI.305-2, GRI.305-3, GRI.305-4], table: {metrics: [ENV.GHG.SCOPE1, ENV.GHG.SCOPE2, ENV.GHG.SCOPE1_2_TOTAL], by_entity: true}, chart: trend}
  - {code: energy, title: Energy, level: 2, source: ai, metrics: [ENV.ENERGY.TOTAL, ENV.ENERGY.INTENSITY_REVENUE, ENV.ENERGY.YOY_CHANGE_PCT, ENV.ENERGY.RENEWABLE_CAPACITY_KW, ENV.ENERGY.RENEWABLE_SHARE_PCT, ENV.ENERGY.EFFICIENCY_INITIATIVES], requirements: [GRI.302-1, GRI.302-3, GRI.302-4, ESRS.E1-5], table: {metrics: [ENV.ENERGY.TOTAL], by_entity: true}}
  - {code: water, title: Water, level: 2, source: ai, metrics: [ENV.WATER.WITHDRAWN, ENV.WATER.CONSUMED, ENV.WATER.DISCHARGED, ENV.WATER.WITHDRAWN_STRESSED_PCT, ENV.WATER.SITES_WATER_STRESSED, ENV.WATER.CONSERVATION_INITIATIVES], requirements: [WEF.PLANET.WATER, GRI.303-3, GRI.303-4, GRI.303-5], table: {metrics: [ENV.WATER.WITHDRAWN, ENV.WATER.CONSUMED, ENV.WATER.DISCHARGED], by_entity: true}}
  - {code: waste, title: Waste and Circular Economy, level: 2, source: ai, metrics: [ENV.WASTE.HAZARDOUS, ENV.WASTE.NON_HAZARDOUS, ENV.WASTE.TOTAL, ENV.WASTE.DIVERTED_PCT, ENV.WASTE.PLASTIC_BAGS_ELIMINATED_PCT, ENV.WASTE.MANAGEMENT_APPROACH], requirements: [GRI.306-3, ESRS.E5-5], table: {metrics: [ENV.WASTE.HAZARDOUS, ENV.WASTE.NON_HAZARDOUS, ENV.WASTE.TOTAL], by_entity: true}}
  - {code: biodiversity, title: Biodiversity and Land Use, level: 2, source: ai, metrics: [ENV.BIODIVERSITY.SITES_NEAR_PROTECTED, ENV.BIODIVERSITY.AREA_NEAR_PROTECTED_HA, ENV.BIODIVERSITY.TREES_PLANTED, ENV.BIODIVERSITY.MANGROVE_HA, ENV.BIODIVERSITY.AFFORESTATION_HA, ENV.BIODIVERSITY.PROGRAMMES], requirements: [WEF.PLANET.LAND_USE, GRI.304-1, GRI.304-3]}
  - {code: social, title: Social, level: 1, source: template}
  - {code: workforce, title: Workforce, level: 2, source: ai, metrics: [SOC.WORKFORCE.TOTAL, SOC.WORKFORCE.PERMANENT, SOC.WORKFORCE.CONTRACTUAL, SOC.WORKFORCE.HIRES, SOC.WORKFORCE.HIRE_RATE_PCT, SOC.WORKFORCE.TURNOVER, SOC.WORKFORCE.TURNOVER_RATE_PCT], requirements: [WEF.PROSPERITY.EMPLOYMENT, GRI.2-7, GRI.401-1], table: {metrics: [SOC.WORKFORCE.TOTAL], by_entity: true}}
  - {code: dei, title: Diversity, Equity and Inclusion, level: 2, source: ai, metrics: [SOC.DEI.PERM_FEMALE_PCT, SOC.DEI.CONTRACT_FEMALE_PCT, SOC.DEI.PERM_AGE_U30_PCT, SOC.DEI.PERM_AGE_31_50_PCT, SOC.DEI.PERM_AGE_50P_PCT, SOC.DEI.PWD_EMPLOYEES, SOC.COMP.ENTRY_WAGE_TO_MIN_WAGE_RATIO, SOC.COMP.GENDER_PAY_RATIO, SOC.COMP.CEO_PAY_RATIO, SOC.DEI.PROGRAMMES], requirements: [WEF.PEOPLE.DIVERSITY, WEF.PEOPLE.PAY_EQUALITY, WEF.PEOPLE.WAGE_LEVEL, GRI.405-1]}
  - {code: talent, title: Talent Development and Engagement, level: 2, source: ai, metrics: [SOC.TALENT.TRAINING_HOURS_PERM, SOC.TALENT.AVG_TRAINING_HOURS_PER_EMPLOYEE, SOC.TALENT.AVG_TRAINING_HOURS_FEMALE, SOC.TALENT.AVG_TRAINING_HOURS_MALE, SOC.TALENT.TRAINING_SPEND_PER_EMPLOYEE_PKR, SOC.TALENT.ENGAGEMENT_SCORE_PCT, SOC.WELLBEING.WELLBEING_SCORE_PCT], requirements: [WEF.PEOPLE.TRAINING, GRI.404-1]}
  - {code: ohs, title: Occupational Health and Safety, level: 2, source: ai, metrics: [SOC.OHS.HOURS_EMP, SOC.OHS.HOURS_CONTRACTOR, SOC.OHS.RECORDABLE_EMP, SOC.OHS.RECORDABLE_CONTRACTOR, SOC.OHS.FATALITIES_EMP, SOC.OHS.FATALITIES_CONTRACTOR, SOC.OHS.HIGH_CONSEQUENCE_INJURIES, SOC.OHS.TRIR_EMP, SOC.OHS.TRIR_CONTRACTOR, SOC.OHS.MANAGEMENT_SYSTEM_DESCRIPTION, SOC.WELLBEING.NON_OCCUPATIONAL_HEALTH_ACCESS], requirements: [WEF.PEOPLE.HEALTH_SAFETY, GRI.403-1, GRI.403-9], chart: trend}
  - {code: human_rights, title: Human Rights and Labour Practices, level: 2, source: ai, metrics: [SOC.LABOR.CHILD_FORCED_LABOR_INCIDENTS, SOC.LABOR.CHILD_FORCED_LABOR_RISK_STATEMENT, SOC.LABOR.COLLECTIVE_BARGAINING_STATEMENT, SOC.HUMAN_RIGHTS.POLICY_COMMITMENT], requirements: [WEF.PEOPLE.CHILD_FORCED_LABOR, GRI.408-1, UNGC.P1, UNGC.P3]}
  - {code: community, title: Community Investment, level: 2, source: ai, metrics: [SOC.COMMUNITY.INVESTMENT_PKR_MN, SOC.COMMUNITY.EF_STUDENTS_FORMAL, SOC.COMMUNITY.EF_PATIENTS_OPD, SOC.COMMUNITY.EF_CVC_FARMERS, SOC.COMMUNITY.TF_STUDENTS, SOC.COMMUNITY.TF_OPD, SOC.COMMUNITY.TF_EMPLOYMENT_KT, SOC.COMMUNITY.PROGRAMMES], requirements: [GRI.413-1]}
  - {code: governance, title: Governance, level: 1, source: template}
  - {code: board, title: Board Composition and Oversight, level: 2, source: ai, metrics: [GOV.BOARD.SIZE, GOV.BOARD.INDEPENDENT, GOV.BOARD.NON_EXECUTIVE, GOV.BOARD.EXECUTIVE, GOV.BOARD.WOMEN, GOV.BOARD.INDEPENDENCE_PCT, GOV.BOARD.WOMEN_PCT, GOV.BOARD.MEETINGS, GOV.BOARD.COMMITTEES, GOV.BOARD.CHANGES], requirements: [WEF.GOV.BOARD_COMPOSITION, GRI.2-9]}
  - {code: ethics, title: Ethics, Anti-corruption and Whistleblowing, level: 2, source: ai, metrics: [GOV.ETHICS.CORRUPTION_CASES_SUBSTANTIATED, GOV.ETHICS.EC_TRAINING_SESSIONS, GOV.ETHICS.EC_ATTENDEES, GOV.ETHICS.EC_LEARNING_HOURS, GOV.ETHICS.ANTI_CORRUPTION_TRAINING_PCT, GOV.ETHICS.CODE_OF_CONDUCT, GOV.ETHICS.WHISTLEBLOWER_MECHANISM], requirements: [WEF.GOV.ANTI_CORRUPTION, WEF.GOV.ETHICS_MECHANISMS, GRI.205-2, GRI.205-3, UNGC.P10]}
  - {code: risk, title: Risk Management, level: 2, source: ai, metrics: [GOV.RISK.ERM_FRAMEWORK, GOV.RISK.CLIMATE_RISK_ASSESSMENT_STATUS], requirements: [WEF.GOV.RISK_OPPORTUNITY, IFRS.S1.RISK]}
  - {code: cyber, title: Cybersecurity and Digitalization, level: 2, source: ai, metrics: [GOV.CYBER.GOVERNANCE_FRAMEWORKS, GOV.CYBER.PHISHING_CAMPAIGNS_PER_YEAR, GOV.DIGITAL.PROJECTS], requirements: []}
  - {code: prosperity, title: Prosperity and Economic Contribution, level: 1, source: ai, metrics: [ECO.FIN.REVENUE, ECO.FIN.REVENUE_GROWTH_PCT, ECO.FIN.EBITDA, ECO.EVGD.WEALTH_GENERATED, ECO.EVGD.EMPLOYEES, ECO.EVGD.GOVERNMENT, ECO.EVGD.SOCIETY, ECO.EVGD.DIVIDENDS, ECO.EVGD.INTEREST, ECO.EVGD.RETAINED, ECO.TAX.TOTAL, ECO.FIN.CAPEX, ECO.FIN.DEPRECIATION, ECO.INVEST.CAPITAL_RETURNED, ECO.GOVT.FINANCIAL_ASSISTANCE, ECO.INNOVATION.RD_EXPENSE], requirements: [WEF.PROSPERITY.ECONOMIC_CONTRIBUTION, WEF.PROSPERITY.FINANCIAL_INVESTMENT, WEF.PROSPERITY.TAX, WEF.PROSPERITY.RD, GRI.201-1], table: {metrics: [ECO.EVGD.EMPLOYEES, ECO.EVGD.GOVERNMENT, ECO.EVGD.SOCIETY, ECO.EVGD.DIVIDENDS, ECO.EVGD.INTEREST, ECO.EVGD.RETAINED], by_entity: false}}
  - {code: targets, title: Targets and Performance, level: 1, source: data}
  - {code: framework_index, title: Framework Index, level: 1, source: data}
  - {code: methodology, title: Methodology and Metric Definitions, level: 1, source: data}
  - {code: assurance, title: Assurance Statement, level: 1, source: data}
  - {code: appendix, title: Appendix — Data Tables and Evidence References, level: 1, source: data}
