# European Sustainability Reporting Standards — subset (E1, E3, E5, S1, G1) for gap analysis.
framework:
  code: ESRS
  name: European Sustainability Reporting Standards
  publisher: EFRAG / European Commission
  description: ESRS Set 1 (Delegated Regulation (EU) 2023/2772). Subset of datapoints relevant to industrial groups.
  jurisdiction: EU
version:
  version: "2023"
  effective_date: 2024-01-01
  status: current
  source_url: https://www.efrag.org/en/sustainability-reporting/esrs
requirements:
  - {code: ESRS.2.SBM-3, title: "Material impacts, risks and opportunities and their interaction with strategy and business model", pillar: governance, theme: ESRS 2 General, disclosure_type: narrative, metrics: [GOV.STAKEHOLDER.MATERIAL_TOPICS]}
  - {code: ESRS.2.IRO-1, title: "Process to identify and assess material impacts, risks and opportunities (double materiality)", pillar: governance, theme: ESRS 2 General, disclosure_type: narrative, metrics: [GOV.STAKEHOLDER.MATERIALITY_PROCESS]}
  - {code: ESRS.E1-1, title: "Transition plan for climate change mitigation", pillar: environment, theme: ESRS E1 Climate Change, disclosure_type: narrative, metrics: [ENV.CLIMATE.TRANSITION_PLAN]}
  - {code: ESRS.E1-4, title: "Targets related to climate change mitigation and adaptation", pillar: environment, theme: ESRS E1 Climate Change, disclosure_type: both, metrics: [ENV.CLIMATE.GHG_TARGET, ENV.CLIMATE.PARIS_TARGET_SET]}
  - {code: ESRS.E1-5, title: "Energy consumption and mix", pillar: environment, theme: ESRS E1 Climate Change, disclosure_type: quantitative, metrics: [ENV.ENERGY.TOTAL, ENV.ENERGY.RENEWABLE_SHARE_PCT, ENV.ENERGY.INTENSITY_REVENUE]}
  - {code: ESRS.E1-6, title: "Gross Scopes 1, 2, 3 and total GHG emissions", pillar: environment, theme: ESRS E1 Climate Change, disclosure_type: quantitative, metrics: [ENV.GHG.SCOPE1, ENV.GHG.SCOPE2, ENV.GHG.SCOPE3, ENV.GHG.SCOPE1_2_TOTAL, ENV.GHG.INTENSITY_REVENUE]}
  - {code: ESRS.E1-7, title: "GHG removals and carbon credits", pillar: environment, theme: ESRS E1 Climate Change, disclosure_type: quantitative, metrics: [ENV.GHG.CARBON_STORED_NATURE]}
  - {code: ESRS.E3-4, title: "Water consumption, and in areas at water risk", pillar: environment, theme: ESRS E3 Water and Marine Resources, disclosure_type: quantitative, metrics: [ENV.WATER.CONSUMED, ENV.WATER.CONSUMED_STRESSED_PCT, ENV.WATER.WITHDRAWN, ENV.WATER.DISCHARGED]}
  - {code: ESRS.E4-5, title: "Impact metrics related to biodiversity and ecosystems change", pillar: environment, theme: ESRS E4 Biodiversity, disclosure_type: quantitative, metrics: [ENV.BIODIVERSITY.SITES_NEAR_PROTECTED, ENV.BIODIVERSITY.AREA_NEAR_PROTECTED_HA, ENV.BIODIVERSITY.AFFORESTATION_HA]}
  - {code: ESRS.E5-5, title: "Resource outflows — waste generated by type and treatment", pillar: environment, theme: ESRS E5 Resource Use and Circular Economy, disclosure_type: quantitative, metrics: [ENV.WASTE.TOTAL, ENV.WASTE.HAZARDOUS, ENV.WASTE.NON_HAZARDOUS, ENV.WASTE.DIVERTED_PCT]}
  - {code: ESRS.S1-6, title: "Characteristics of the undertaking's employees", pillar: social, theme: ESRS S1 Own Workforce, disclosure_type: quantitative, metrics: [SOC.WORKFORCE.TOTAL, SOC.WORKFORCE.PERMANENT, SOC.WORKFORCE.CONTRACTUAL, SOC.DEI.PERM_FEMALE, SOC.DEI.PERM_MALE, SOC.WORKFORCE.TURNOVER_RATE_PCT]}
  - {code: ESRS.S1-9, title: "Diversity metrics — gender at top management and age distribution", pillar: social, theme: ESRS S1 Own Workforce, disclosure_type: quantitative, metrics: [SOC.DEI.PERM_AGE_U30_PCT, SOC.DEI.PERM_AGE_31_50_PCT, SOC.DEI.PERM_AGE_50P_PCT, SOC.DEI.C1_WOMEN_RISE_PCT]}
  - {code: ESRS.S1-13, title: "Training and skills development metrics", pillar: social, theme: ESRS S1 Own Workforce, disclosure_type: quantitative, metrics: [SOC.TALENT.AVG_TRAINING_HOURS_PER_EMPLOYEE, SOC.TALENT.AVG_TRAINING_HOURS_FEMALE, SOC.TALENT.AVG_TRAINING_HOURS_MALE]}
  - {code: ESRS.S1-14, title: "Health and safety metrics", pillar: social, theme: ESRS S1 Own Workforce, disclosure_type: quantitative, metrics: [SOC.OHS.FATALITIES_EMP, SOC.OHS.RECORDABLE_EMP, SOC.OHS.TRIR_EMP, SOC.OHS.HOURS_EMP, SOC.OHS.FATALITIES_CONTRACTOR]}
  - {code: ESRS.S1-16, title: "Remuneration metrics (pay gap and total remuneration ratio)", pillar: social, theme: ESRS S1 Own Workforce, disclosure_type: quantitative, metrics: [SOC.COMP.GENDER_PAY_RATIO, SOC.COMP.CEO_PAY_RATIO]}
  - {code: ESRS.S1-17, title: "Incidents, complaints and severe human rights impacts", pillar: social, theme: ESRS S1 Own Workforce, disclosure_type: quantitative, metrics: [SOC.LABOR.CHILD_FORCED_LABOR_INCIDENTS, GOV.ETHICS.CORRUPTION_CASES_SUBSTANTIATED]}
  - {code: ESRS.G1-1, title: "Business conduct policies and corporate culture", pillar: governance, theme: ESRS G1 Business Conduct, disclosure_type: narrative, metrics: [GOV.ETHICS.CODE_OF_CONDUCT, GOV.ETHICS.WHISTLEBLOWER_MECHANISM]}
  - {code: ESRS.G1-3, title: "Prevention and detection of corruption and bribery", pillar: governance, theme: ESRS G1 Business Conduct, disclosure_type: both, metrics: [GOV.ETHICS.EC_TRAINING_SESSIONS, GOV.ETHICS.ANTI_CORRUPTION_TRAINING_PCT]}
  - {code: ESRS.G1-4, title: "Confirmed incidents of corruption or bribery", pillar: governance, theme: ESRS G1 Business Conduct, disclosure_type: quantitative, metrics: [GOV.ETHICS.CORRUPTION_CASES_SUBSTANTIATED]}
