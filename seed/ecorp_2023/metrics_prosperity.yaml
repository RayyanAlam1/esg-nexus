# Prosperity metrics — "performance with purpose" (pp.95–110): key figures, snapshot, wealth generated & distributed,
# business-unit performance, capex & buyback, tax, credit ratings. Monetary values in PKR millions unless stated.
defaults:
  evidence_required: true
  assurance: limited
  status: final
metrics:
  # ------------------------------------------------------------------ CONSOLIDATED FINANCIALS
  - code: ECO.FIN.REVENUE
    name: Consolidated revenue
    topic: economic_performance
    subtopic: financials
    unit: PKR mn
    data_type: currency
    kind: raw
    aggregation: none
    direction: higher_is_better
    is_kpi: true
    frameworks: [WEF.PROSPERITY.ECONOMIC_CONTRIBUTION, SDG.8]
    materiality: economic_performance
    values: {ECORP: {FY2023: 482489, FY2022: 356428}}
    evidence: [P97, P101, P103]
  - code: ECO.FIN.REVENUE_GROWTH_PCT
    name: Consolidated revenue growth
    topic: economic_performance
    subtopic: growth
    unit: "%"
    data_type: percentage
    kind: yoy
    aggregation: none
    direction: higher_is_better
    formula: "yoy({ECO.FIN.REVENUE}, {ECO.FIN.REVENUE@prev})"
    inputs: [ECO.FIN.REVENUE]
    validation: {tolerance_pct: 3}
    source_type: reported
    values: {ECORP: {FY2023: 35}}
    evidence: [P19, P103]
    description: Reported "grew by 35%"; recalculated 35.4%.
