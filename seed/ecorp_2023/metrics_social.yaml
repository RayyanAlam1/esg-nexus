    kind: derived
    aggregation: none
    formula: "nz({SOC.WORKFORCE.PERMANENT}) + nz({SOC.WORKFORCE.NMPT@entity:EFERT}) + nz({SOC.WORKFORCE.CONTRACTUAL})"
