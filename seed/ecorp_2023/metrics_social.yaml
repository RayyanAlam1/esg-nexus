# Social metrics — "people" (pp.39–56), occupational health & safety (pp.59–67), community investments (pp.68–76)
# and the SDG sections (pp.122–133).
defaults:
  evidence_required: true
  assurance: limited
  status: final
metrics:
  # ------------------------------------------------------------------ WORKFORCE
  - code: SOC.WORKFORCE.TOTAL
    name: Total employees
    topic: workforce
    subtopic: headcount
    unit: headcount
    data_type: integer
    kind: raw
    aggregation: sum
    direction: neutral
    is_kpi: true
    frameworks: [GRI.2-7, ESRS.S1-6, SDG.8]
    materiality: employee_wellbeing
    validation: {min: 0, max_yoy_change_pct: 30}
    description: Permanent + non-management permanent (NMPT, EFERT only) + contractual employees, group-wide. Company-wise headcount is recorded on each entity; the group root holds the printed total.
    values:
      ECORP: {FY2023: 3514, FY2022: 3532}
      ECORP-HQ: {FY2023: 413, FY2022: 368}
      EFERT: {FY2023: 1526, FY2022: 1635}
      EPCL: {FY2023: 491, FY2022: 470}
      EEL: {FY2023: 710, FY2022: 679}
      ENFRA: {FY2023: 170, FY2022: 161}
      EEAP: {FY2023: 101, FY2022: 109}
      EVTL_EETL: {FY2023: 103, FY2022: 110}
    evidence: [P41, P42, P101]
    notes: "Company-wise values read from the bar chart (p.42) and cross-checked against the 'employees under management' shares (p.101): EFERT 43%, EEL 20%, EPCL 14%, ECORP 12%, Enfrashare 5%, EEAP 3%, EVTL/EETL 3%. Entity values sum exactly to the printed totals for both years."
