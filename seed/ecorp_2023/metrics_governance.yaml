    evidence: [P33, P34, P35, P36]
  - code: GOV.STAKEHOLDER.MATERIAL_TOPICS
    name: Material topics and identification process (narrative)
    topic: stakeholder_engagement
    subtopic: materiality
    data_type: text
    kind: narrative
    aggregation: none
    is_kpi: true
    frameworks: [WEF.GOV.MATERIAL_ISSUES, GRI.3-3, IFRS.S1.STRATEGY, IFRS.S1.METRICS, ESRS.2.SBM-3]
    text_values: {ECORP: {FY2023: "Material topics — Economic: Economic Performance, Ethics & Compliance; Social: Employee Benefits & Wellbeing, Occupational Health & Safety, Diversity Equity & Inclusion, Community Investments; Environmental: Energy & Emissions, Water, Materials (availability, procurement, utilisation), Waste. Identified via stakeholder engagement, internal impact assessment (severity × likelihood) and prioritisation against a threshold informed by the ERM framework."}}
    evidence: [P37, P38]
  - code: GOV.STAKEHOLDER.MATERIALITY_PROCESS
    name: Materiality assessment methodology (narrative)
    topic: stakeholder_engagement
    subtopic: materiality
    data_type: text
    kind: narrative
    aggregation: none
    frameworks: [ESRS.2.IRO-1]
    text_values: {ECORP: {FY2023: "Three criteria — stakeholders of the company; continued growth, performance and success; economy, environment and local communities. Stakeholder engagement → internal impact assessment (quantitative and qualitative, severity and likelihood) → prioritisation via materiality threshold with uniform ERM-based scoring. Financial materiality is not separately scored (single-lens impact assessment; double materiality not explicit)."}}
    evidence: [P37]
  - code: GOV.STAKEHOLDER.GROUPS
    name: Key stakeholder groups identified
    topic: stakeholder_engagement
    subtopic: engagement
    unit: count
    data_type: integer
    kind: raw
    aggregation: none
    evidence_required: false
    values: {ECORP: {FY2023: 8}}
    evidence: [P33]
