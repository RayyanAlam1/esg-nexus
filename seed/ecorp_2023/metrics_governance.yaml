  # ------------------------------------------------------------------ ETHICS & COMPLIANCE
  - code: GOV.ETHICS.CORRUPTION_CASES_SUBSTANTIATED
    name: Substantiated corruption and bribery cases
    topic: ethics_compliance
    subtopic: anti_corruption
    unit: count
    data_type: integer
    kind: raw
    aggregation: sum
    direction: lower_is_better
    is_kpi: true
    frameworks: [WEF.GOV.ANTI_CORRUPTION, GRI.205-3, UNGC.P10, ESRS.G1-4, ESRS.S1-17, SDG.16]
    materiality: ethics_compliance
    values: {ECORP: {FY2023: 4, FY2022: 2}}
    evidence: [P31]
    description: Total substantiated cases across Engro companies pertaining to corruption & bribery; the split between current-year and prior-year-related incidents required by WEF is not disclosed.
  - code: GOV.ETHICS.EC_TRAINING_SESSIONS
    name: Ethics & Compliance training sessions / roadshows
    topic: ethics_compliance
    subtopic: training
    unit: count
    data_type: integer
    kind: raw
    aggregation: sum
    direction: higher_is_better
    frameworks: [WEF.GOV.ANTI_CORRUPTION, GRI.205-2, UNGC.P10, ESRS.G1-3]
    materiality: ethics_compliance
    values: {ECORP: {FY2023: 45, FY2022: 45}}
    evidence: [P32]
  - code: GOV.ETHICS.EC_ATTENDEES
    name: Ethics & Compliance training attendees
    topic: ethics_compliance
    subtopic: training
    unit: headcount
    data_type: integer
    kind: raw
    aggregation: sum
    direction: higher_is_better
    is_kpi: true
    frameworks: [WEF.GOV.ANTI_CORRUPTION, GRI.205-2]
    materiality: ethics_compliance
    values: {ECORP: {FY2023: 1800, FY2022: 1804}}
    evidence: [P32]
  - code: GOV.ETHICS.EC_LEARNING_HOURS
    name: Ethics & Compliance learning hours
    topic: ethics_compliance
    subtopic: training
    unit: hours
    data_type: decimal
    kind: raw
    aggregation: sum
    direction: higher_is_better
    frameworks: [WEF.GOV.ANTI_CORRUPTION, UNGC.P10]
    values: {ECORP: {FY2023: 5400, FY2022: 4510}}
    evidence: [P32]
  - code: GOV.ETHICS.EC_HOURS_PER_ATTENDEE
    name: Average E&C learning hours per attendee
    topic: ethics_compliance
    subtopic: training
    unit: hours
    data_type: ratio
    kind: derived
    aggregation: none
    formula: "safe_div({GOV.ETHICS.EC_LEARNING_HOURS}, {GOV.ETHICS.EC_ATTENDEES})"
    inputs: [GOV.ETHICS.EC_LEARNING_HOURS, GOV.ETHICS.EC_ATTENDEES]
    evidence_required: false
  - code: GOV.ETHICS.ANTI_CORRUPTION_TRAINING_PCT
    name: Share of employees trained on anti-corruption (attendees ÷ total employees)
    topic: ethics_compliance
    subtopic: training
    unit: "%"
    data_type: percentage
    kind: derived
    aggregation: none
    direction: higher_is_better
    formula: "pct({GOV.ETHICS.EC_ATTENDEES}, {SOC.WORKFORCE.TOTAL})"
    inputs: [GOV.ETHICS.EC_ATTENDEES, SOC.WORKFORCE.TOTAL]
    frameworks: [WEF.GOV.ANTI_CORRUPTION, GRI.205-2, ESRS.G1-3]
    evidence_required: false
    description: Proxy computed from attendees and headcount (≈51%). WEF asks for governance body members, employees and business partners by region — the exact breakdown is not disclosed, so this is a partial indicator.
  - code: GOV.ETHICS.CODE_OF_CONDUCT
    name: Code of Conduct and policy suite (narrative)
    topic: ethics_compliance
    subtopic: policies
    data_type: text
    kind: narrative
    aggregation: none
    frameworks: [WEF.GOV.ETHICS_MECHANISMS, GRI.2-23, UNGC.P1, ESRS.G1-1]
    text_values: {ECORP: {FY2023: "Code of Conduct applies to all employees and Board members; covers Statement of Ethics & Business Practices, Conflicts of Interest policy, Insider Trading policy, Whistleblower policy (Speak Out), Statement of Internal Control System, Gifts & Business Entertainment guidelines, related-party transactions, Competition policy; centralised portals for mandatory CoI and gift disclosures managed by E&C."}}
    evidence: [P29, P30]
  - code: GOV.ETHICS.WHISTLEBLOWER_MECHANISM
    name: Whistleblower and ethics advice mechanisms (narrative)
    topic: ethics_compliance
    subtopic: whistleblowing
    data_type: text
    kind: narrative
    aggregation: none
    is_kpi: true
    frameworks: [WEF.GOV.ETHICS_MECHANISMS, GRI.2-26, UNGC.P2, UNGC.P10, ESRS.G1-1, SDG.16]
    text_values: {ECORP: {FY2023: "Speak Out platform (anonymous; internal and external stakeholders; email published on website) managed by the independent E&C team reporting to BARC; Internal Investigation Procedure with independent investigators; feedback to complainants at closure; quarterly summary of all cases to the Board via BARC; employees may seek advice from E&C by email or directly."}}
    evidence: [P29, P30, P31]
  - code: GOV.ETHICS.UNGC_SIGNATORY
    name: UN Global Compact commitment letter submitted
    topic: ethics_compliance
    subtopic: policies
    data_type: boolean
    kind: raw
    aggregation: none
    values: {ECORP: {FY2023: 1}}
    evidence: [P31, P144]
  - code: GOV.ETHICS.AWARENESS_ACTIVITIES
    name: Group-wide E&C engagement activities
    topic: ethics_compliance
    subtopic: training
    unit: count
    data_type: integer
    kind: raw
    aggregation: sum
    assurance: not_assured
    values: {ECORP: {FY2023: 2}}
    evidence: [P32]
  # ------------------------------------------------------------------ RISK MANAGEMENT
  - code: GOV.RISK.ERM_FRAMEWORK
    name: Enterprise risk management approach (narrative)
    topic: risk_management
    subtopic: erm
    data_type: text
    kind: narrative
    aggregation: none
    frameworks: [WEF.GOV.RISK_OPPORTUNITY, IFRS.S1.STRATEGY, IFRS.S1.RISK]
    text_values: {ECORP: {FY2023: "Lean Enterprise Risk Management framework approved by the Board; each subsidiary assesses probability and impact, assigns responsibilities and mitigation strategies monitored by the Management Committee and Board; risks ranked by impact and probability; key risks and mitigants disclosed in the Annual Report; 2024 focus buckets — plant reliability, cost optimisation, supply-chain security, export strategy, global partnerships via Engro Eximp FZE, CGM culture."}}
    evidence: [P97, P109, P110]
    notes: "WEF requires company-specific principal risks, risk appetite and movement over time — largely cross-referenced to the Annual Report (narrative gap in the sustainability report itself)."
  - code: GOV.RISK.CLIMATE_RISK_ASSESSMENT_STATUS
    name: Climate-related risk assessment status (narrative)
    topic: risk_management
    subtopic: climate_risk
    data_type: text
    kind: narrative
    aggregation: none
    is_kpi: true
    frameworks: [WEF.GOV.RISK_OPPORTUNITY, IFRS.S2.STRATEGY.RISKS, UNGC.P7, SDG.13]
    materiality: energy_emissions
    text_values: {ECORP: {FY2023: "Preliminary, cross-business assessment of climate-related physical and transition risks and opportunities guided by TCFD (initiated 2022); financial implications not yet quantified; adaptation measures identified on an ongoing basis; intention to align with IFRS climate standards."}}
    evidence: [P111, P137]
  # ------------------------------------------------------------------ STAKEHOLDER ENGAGEMENT & MATERIALITY
  - code: GOV.STAKEHOLDER.ENGAGEMENT_APPROACH
