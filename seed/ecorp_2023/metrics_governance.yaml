# Governance metrics — principles of governance (pp.25–38), digitalization & information security (pp.111–120),
# reporting boundary & assurance (pp.01–02, 144–147), memberships (pp.143–144).
defaults:
  evidence_required: true
  assurance: limited
  status: final
metrics:
  # ------------------------------------------------------------------ ORGANISATION & REPORTING
  - code: GOV.ORG.LEGAL_FORM
    name: Legal name, ownership and legal form
    topic: reporting_assurance
    subtopic: boundary
    data_type: text
    kind: narrative
    aggregation: none
    frameworks: [GRI.2-1]
    evidence_required: false
    text_values: {ECORP: {FY2023: "Engro Corporation Limited; Public Listed Company (PSX: ENGRO); headquartered in Karachi, Pakistan."}}
    evidence: [P1]
  - code: GOV.ORG.REPORTING_BOUNDARY
    name: Reporting boundary and entities included
    topic: reporting_assurance
    subtopic: boundary
    data_type: text
    kind: narrative
    aggregation: none
    frameworks: [GRI.2-2]
    text_values: {ECORP: {FY2023: "Consolidated operations of Engro Corporation and its Pakistan-based businesses under management control; effects beyond business operations excluded due to non-availability of verifiable data. Active entities listed in the group structure (p.07)."}}
    evidence: [P1, P7]
  - code: GOV.ORG.REPORTING_PERIOD
    name: Reporting period, cycle and contact point
    topic: reporting_assurance
    subtopic: boundary
    data_type: text
    kind: narrative
    aggregation: none
    frameworks: [GRI.2-3]
    evidence_required: false
    text_values: {ECORP: {FY2023: "1 January 2023 – 31 December 2023; annual cycle; supplements the corporate annual report; contact Corporate Communications (corpcomms@engro.com)."}}
    evidence: [P1, P2]
  - code: GOV.ASSURANCE.EXTERNAL_ASSURANCE
    name: External assurance scope and standard
    topic: reporting_assurance
    subtopic: assurance
    data_type: text
    kind: narrative
    aggregation: none
    is_kpi: true
    frameworks: [GRI.2-5]
    text_values: {ECORP: {FY2023: "Independent limited assurance under ISAE 3000 on selected metrics aligned with WEF Stakeholder Capitalism Core Metrics; Independent Limited Assurance Report included in the report (pp.144–147)."}}
    evidence: [P2, P145]
  - code: GOV.ASSURANCE.FRAMEWORKS_APPLIED
    name: Reporting frameworks applied
    topic: reporting_assurance
    subtopic: frameworks
    data_type: text
    kind: narrative
    aggregation: none
    evidence_required: false
    text_values: {ECORP: {FY2023: "WEF Stakeholder Capitalism Metrics (Core); UN Sustainable Development Goals; Ten Principles of the UN Global Compact. Data prepared per international standards; reasonable estimates where data unavailable."}}
    evidence: [P2]
  - code: GOV.PURPOSE.STATEMENT
    name: Stated purpose, vision and mission
    topic: reporting_assurance
    subtopic: frameworks
    data_type: text
    kind: narrative
    aggregation: none
    frameworks: [WEF.GOV.PURPOSE, GRI.2-22]
    evidence_required: false
    text_values: {ECORP: {FY2023: "Vision: to be the premier Pakistani enterprise with a global reach, passionately pursuing value creation for all stakeholders. Mission: unlocking Pakistan's potential through globally competitive, inclusive solutions to today's most pressing issues. Core values: health, safety & environment; ethics & integrity; community & society. Six-capitals integrated business model."}}
    evidence: [P3, P5, P9, P11]
