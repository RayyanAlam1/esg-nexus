  - code: GOV.BOARD.INDEPENDENCE_PCT
    name: Board independence (independent ÷ board size)
    topic: board
    subtopic: composition
    unit: "%"
    data_type: percentage
    kind: derived
    aggregation: none
    direction: higher_is_better
    is_kpi: true
    formula: "pct({GOV.BOARD.INDEPENDENT}, {GOV.BOARD.SIZE})"
    inputs: [GOV.BOARD.INDEPENDENT, GOV.BOARD.SIZE]
    frameworks: [WEF.GOV.BOARD_COMPOSITION, SDG.16]
