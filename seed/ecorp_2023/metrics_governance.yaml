    aggregation: none
    direction: higher_is_better
    is_kpi: true
    formula: "pct({GOV.BOARD.WOMEN}, {GOV.BOARD.WOMEN} + {GOV.BOARD.MEN})"
    inputs: [GOV.BOARD.WOMEN, GOV.BOARD.MEN]
    frameworks: [WEF.GOV.BOARD_COMPOSITION, GRI.405-1]
