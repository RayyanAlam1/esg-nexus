    notes: "'Over 80 warehouses' at 7.2 kW per day per warehouse."
  - code: ENV.ENERGY.SAVINGS_MWH
    name: Annual energy saving from Zero-Gap electrolyser modification
    topic: energy
    subtopic: efficiency
    unit: MWh
    data_type: decimal
    kind: raw
    aggregation: sum
    direction: higher_is_better
