# Environment metrics — every quantitative and qualitative disclosure in the "planet" section (report pp.79–94)
# plus climate items from pp.111 and SDG sections (pp.134–141).
#
# Value format: values: {ENTITY: {PERIOD: value}}; evidence: [P80] = printed page 80 of the report.
# `kind: derived` metrics carry a formula evaluated by the deterministic metric engine. Where the report also
# prints the derived number, it is stored as a *reported* value so the engine can check consistency.
defaults:
  evidence_required: true
  assurance: limited          # WEF core metrics are covered by ISAE 3000 limited assurance (p.02)
  status: final
metrics:
  # ------------------------------------------------------------------ ENERGY
  - code: ENV.ENERGY.TOTAL
    name: Total energy consumption
    topic: energy
    subtopic: consumption
    unit: GJ
    data_type: decimal
    kind: raw
    aggregation: sum
    direction: lower_is_better
    is_kpi: true
    frameworks: [WEF.PLANET.GHG_EMISSIONS, GRI.302-1, ESRS.E1-5, SASB.RT-CH-130a.1, SDG.7]
    materiality: energy_emissions
    validation: {min: 0, max_yoy_change_pct: 100}
    description: Total energy consumed within the organisation (natural gas as feedstock/fuel, purchased grid electricity, other fuels), in gigajoules.
    method: Measured and monitored at each company and plant site; group primary sources are natural gas and purchased electricity (p.79).
    values:
      EEL: {FY2023: 53797488, FY2022: 51638577}
      EFERT: {FY2023: 31355427, FY2022: 28417783}
      EVTL: {FY2023: 8186, FY2022: 8262}
      EETL: {FY2023: 1367, FY2022: 2543}
      EPCL: {FY2023: 6451776, FY2022: 6593151}
      EEAP: {FY2023: 55616, FY2022: 79938}
      ECORP-HQ: {FY2023: 1073, FY2022: 1939}
      ENFRA: {FY2023: 777520, FY2022: 442360}
    evidence: [P80]
    notes: "Group total 92,448,453 GJ (2023) and 87,184,554 GJ (2022) as printed; the consolidation engine reproduces the totals from entity values."
  - code: ENV.ENERGY.TOTAL_REPORTED
    name: Total energy consumption (group total as printed)
    topic: energy
    subtopic: consumption
    unit: GJ
    data_type: decimal
    kind: raw
    aggregation: none
    direction: lower_is_better
    frameworks: [GRI.302-1]
    values: {ECORP: {FY2023: 92448453, FY2022: 87184554}}
    evidence: [P80]
    description: Printed group total, retained to cross-check the consolidated sum of entity values.
  - code: ENV.ENERGY.INTENSITY_REVENUE
    name: Energy intensity per revenue
    topic: energy
    subtopic: efficiency
    unit: GJ / PKR mn
    data_type: ratio
    kind: intensity
    aggregation: none
    direction: lower_is_better
    is_kpi: true
    formula: "safe_div({ENV.ENERGY.TOTAL}, {ECO.FIN.REVENUE})"
    inputs: [ENV.ENERGY.TOTAL, ECO.FIN.REVENUE]
    frameworks: [GRI.302-3, ESRS.E1-5]
    evidence_required: false
    description: Total energy consumption divided by consolidated revenue.
  - code: ENV.ENERGY.YOY_CHANGE_PCT
    name: Energy consumption year-over-year change
    topic: energy
    subtopic: consumption
    unit: "%"
    data_type: percentage
    kind: yoy
    aggregation: none
    direction: lower_is_better
    formula: "yoy({ENV.ENERGY.TOTAL}, {ENV.ENERGY.TOTAL@prev})"
    inputs: [ENV.ENERGY.TOTAL]
    evidence_required: false
    validation: {min: -100, max: 1000}
  - code: ENV.ENERGY.RENEWABLE_CAPACITY_KW
    name: Installed renewable (solar) generation capacity
    topic: energy
    subtopic: renewable
    unit: kW
    data_type: decimal
    kind: raw
    aggregation: sum
    direction: higher_is_better
    is_kpi: true
    frameworks: [UNGC.P9, SDG.7]
    assurance: not_assured
    values:
      SECMC: {FY2023: 5000}
      EPTL: {FY2023: 30}
      EEAP: {FY2023: 1000}
      EVTL_EETL: {FY2023: 158}
    evidence: [P83]
    description: Solar capacity installed at operating sites (SECMC 5 MW auxiliary load; EPTL 30 kW admin building; EEAP 1 MW; EVTL & EETL 158 kW).
    notes: "EFERT warehouse solarization is recorded separately (count of warehouses) because capacity is stated as '7.2 kW per day per warehouse'."
  - code: ENV.ENERGY.RENEWABLE_SHARE_PCT
    name: Share of renewable energy in total energy consumption
    topic: energy
    subtopic: renewable
    unit: "%"
    data_type: percentage
    kind: percentage
    aggregation: none
    direction: higher_is_better
    frameworks: [ESRS.E1-5, SASB.RT-CH-130a.1]
    formula: "pct({ENV.ENERGY.RENEWABLE_CONSUMPTION}, {ENV.ENERGY.TOTAL})"
    inputs: [ENV.ENERGY.RENEWABLE_CONSUMPTION, ENV.ENERGY.TOTAL]
    description: Renewable energy consumption ÷ total energy consumption × 100. Renewable consumption in GJ is not disclosed at group level for 2023 — Data unavailable.
  - code: ENV.ENERGY.RENEWABLE_CONSUMPTION
    name: Renewable energy consumption
    topic: energy
    subtopic: renewable
