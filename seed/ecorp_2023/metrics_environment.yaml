    data_type: percentage
    kind: raw
    aggregation: none
    direction: higher_is_better
    assurance: not_assured
    values: {ENFRA: {FY2023: 50}}
    evidence: [P83]
    is_estimate: true
    notes: "Reported as '~50% of Enfra's telecommunications towers'."
  - code: ENV.ENERGY.SOLARIZED_WAREHOUSES
