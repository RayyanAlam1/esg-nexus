    description: 3 of the electrolysers replaced with Zero-Gap technology → 6% reduction in overall energy consumption.
  - code: ENV.ENERGY.EFFICIENCY_INITIATIVES
    name: Energy efficiency initiatives (narrative)
    topic: energy
    subtopic: efficiency
    data_type: text
    kind: narrative
    aggregation: none
    evidence_required: true
    assurance: not_assured
    text_values:
      EFERT: {FY2023: "Plant-1 furnace optimization; AM-II HP purges reduction; NH3 converter optimization; AM-3 HTSC temperature optimization; steam optimizations at URUT-III & Ammonia-III; feed gas enrichment (CO2 reduction); Plant-II flare system; LTR primary reformer burner and turbine exhaust duct replacement; technical paper accepted at Nitrogen+Syngas 2023."}
      EPCL: {FY2023: "HRSG and Tornado gas turbine insulation rectification; Zero-Gap electrolysers (3 replaced); Oxy Vent Recycle (OVR) and High Temperature Direct Chlorination (HTDC) investments; cooling tower pump load optimization."}
      EPQL: {FY2023: "Uses low-BTU high-sulphur permeate gas from Qadirpur field (previously flared) for electricity generation."}
